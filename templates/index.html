<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Qibla Direction in North America</title>
</head>
<body>
    <div class="sidebar">
        <h1>Qibla in North America</h1>
        <select id="countrySelect" name="country">
            <option value="">Select your country</option>
            {% for country in countries %}
                <option value="{{ country }}">{{ country }}</option>
            {% endfor %}
        </select>
        <select id="citySelect" name="city" style="display: none;">
            <option value="">Select your city</option>
        </select>
        <button id="calculateButton" style="display: none;">Calculate Bearing</button>
        <div id="results"></div>
    </div>
    <div class="content">
        <p>Welcome to the Qibla Direction Finder for North America.</p>
    </div>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
