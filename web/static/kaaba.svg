<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Kaaba">
  <title>Kaaba</title>
  <!-- Faces of the cube -->
  <polygon points="12,22 50,14 88,22 50,30" fill="#2b2b2b"/>
  <polygon points="12,22 50,30 50,92 12,82" fill="#1a1a1a"/>
  <polygon points="50,30 88,22 88,82 50,92" fill="#0b0b0b"/>
  <!-- Gold band (hizam) -->
  <polygon points="12,32 50,40 50,47 12,39" fill="#d9a521"/>
  <polygon points="50,40 88,32 88,39 50,47" fill="#b8860b"/>
  <!-- Door -->
  <polygon points="61,55.7 71,53.6 71,77.6 61,79.7" fill="#c9971c"/>
  <polygon points="63,57.3 69,56 69,75.9 63,77.2" fill="none" stroke="#8a6408" stroke-width="0.8"/>
  <!-- Edge highlight -->
  <line x1="50" y1="30" x2="50" y2="92" stroke="#3a3a3a" stroke-width="0.6"/>
</svg>
